[pytest]
minversion = 9.0
pythonpath = pyaqsapi
             pyaqsapi/bybox
             pyaqsapi/bycbsa
             pyaqsapi/bycounty
             pyaqsapi/byma
             pyaqsapi/bypqao
             pyaqsapi/bysite
             pyaqsapi/bystate
testpaths = tests
            pyaqsapi/bybox/tests
            pyaqsapi/bycbsa/tests
            pyaqsapi/bycounty/tests
            pyaqsapi/byma/tests
            pyaqsapi/bypqao/tests
            pyaqsapi/bysite/tests
            pyaqsapi/bystate/tests
# combine-as-imports = true
# show-source = true
# currently pytest-sugar is incompatible with pytest 9.2 so it is disable until that issue is fixed
# refer to https://github.com/Teemu/pytest-sugar/issues/312
addopts =-p no:anyio
         -p no:sugar
         --ruff
         --ruff-format
         --color auto
         --cache-clear
         --reruns 3
         --reruns-delay 30
         --cov=pyaqsapi
         --verbosity=2
         --cov-config=.coveragerc
         --cov-report html
         --import-mode=importlib
         --ruff-config=pyproject.toml
