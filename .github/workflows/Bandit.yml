name: Bandit

on: [push, pull_request, workflow_dispatch]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Bandit with TOML support
        run: python -m pip install --upgrade "bandit[toml]"

      - name: Perform Bandit analysis
        id: bandit
        continue-on-error: true
        run: |
          bandit \
            --recursive . \
            --configfile pyproject.toml \
            --format json \
            --output bandit-results.json

      - name: Fail if Bandit found issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1